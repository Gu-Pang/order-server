services:
  order-server:
    build: .
    container_name: order-server
    ports:
      - "19010:19010"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://gupang-db:5432/${DB_DATABASE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - gupang-network

networks:
  gupang-network:
    external: true